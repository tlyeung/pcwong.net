name: Deploy Zola site to Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build Zola and Upload Artifact
        uses: getzola/github-pages@v1
        with:
          zola_version: "v0.23.6"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
